name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build-and-push:
    name: Build and Push Production Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "::error title=Missing Docker Hub username::Add DOCKER_USERNAME to repository secrets."
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error title=Missing Docker Hub password::Add DOCKER_PASSWORD to repository secrets."
            exit 1
          fi

      - name: Set Docker image name
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          image_name="${DOCKER_USERNAME}/${REPOSITORY_NAME}"
          echo "IMAGE_NAME=${image_name,,}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss' tz='UTC'}}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Production image for the Acquisitions API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add Docker publish summary
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            echo "- Image: \`$IMAGE_NAME\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "### Tags"
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
